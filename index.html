<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Wallpaper Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Courier+Prime&family=Cutive+Mono&family=Fira+Mono&family=IBM+Plex+Mono&family=Inconsolata&family=JetBrains+Mono&family=Martian+Mono&family=Nova+Mono&family=Overpass+Mono&family=Roboto+Mono&family=Share+Tech+Mono&family=Source+Code+Pro&family=Space+Mono&family=Ubuntu+Mono&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body>

<h1>ASCII Wallpaper Generator</h1>

<label style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;display:block;margin-bottom:4px;">ASCII Text</label>
<div class="textarea-controls">
  <button onclick="clearAscii()">Clear</button>
  <button onclick="pasteAscii()">Paste</button>
  <button onclick="$('fileInput').click()">Load file</button>
  <input type="file" id="fileInput" accept=".txt" style="display:none">
  <span style="width:1px;background:#333;align-self:stretch;"></span>
  <button class="step-btn" onclick="stepTextarea(-1)">−</button>
  <span id="taSize" style="font-size:11px;color:#666;min-width:28px;text-align:center;">12px</span>
  <button class="step-btn" onclick="stepTextarea(1)">+</button>
</div>

<div class="ctrl-group-label">// Canvas</div>
<div class="ctrl-grid">
  <div class="col">
    <label>Resolution</label>
    <select id="orient">
      <option value="fhd-l">FHD Landscape — 1920x1080</option>
      <option value="fhd-p">FHD Portrait — 1080x1920</option>
      <option value="wuxga-l">WUXGA Landscape — 1920x1200</option>
      <option value="wuxga-p">WUXGA Portrait — 1200x1920</option>
      <option value="2k-l">2K Landscape — 2560x1440</option>
      <option value="2k-p">2K Portrait — 1440x2560</option>
      <option value="4k-l">4K Landscape — 3840x2160</option>
      <option value="4k-p">4K Portrait — 2160x3840</option>
    </select>
  </div>
  <div class="col">
    <label>Background color <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Click the swatch to open the color picker. Click ⊕ then click on the preview canvas to sample a color.</span></span></label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="color" id="bgColor" value="#0d0d0d" style="display:none">
      <div class="cp-swatch" data-for="bgColor" style="background:#0d0d0d;" onclick="openCP('bgColor',this)"></div>
      <button class="step-btn eyedrop-btn" data-target="bgColor" style="width:auto;padding:0 8px;font-size:13px;" onclick="startPick('bgColor')">⊕</button>
    </div>
  </div>
</div>

<div class="ctrl-group-label">// Text</div>
<div class="ctrl-grid">
  <div class="col">
    <label>Font</label>
    <select id="fontfam">
      <option value="'Share Tech Mono', monospace" selected>Share Tech Mono</option>
      <option value="'VT323', monospace">VT323 — CRT terminal</option>
      <option value="'Nova Mono', monospace">Nova Mono</option>
      <option value="'Martian Mono', monospace">Martian Mono</option>
      <option value="'Cutive Mono', monospace">Cutive Mono — typewriter</option>
      <option value="'Inconsolata', monospace">Inconsolata</option>
      <option value="'Source Code Pro', monospace">Source Code Pro</option>
      <option value="'Anonymous Pro', monospace">Anonymous Pro</option>
      <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      <option value="'Fira Mono', monospace">Fira Mono</option>
      <option value="'Overpass Mono', monospace">Overpass Mono</option>
      <option value="'Ubuntu Mono', monospace">Ubuntu Mono</option>
      <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
      <option value="'Roboto Mono', monospace">Roboto Mono</option>
      <option value="'Space Mono', monospace">Space Mono</option>
      <option value="'Courier Prime', monospace">Courier Prime — typewriter</option>
      <option value="monospace">System Monospace</option>
    </select>
  </div>
  <div class="col">
    <label>Font size</label>
    <div class="range-row">
      <button class="step-btn" onclick="stepFont(-1)">−</button>
      <input type="range" id="fsize" min="1" max="120" value="14" step="1">
      <button class="step-btn" onclick="stepFont(1)">+</button>
      <span class="range-val" id="fsizeOut">14px</span>
    </div>
  </div>
  <div class="col">
    <label>Text color <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Click the swatch to open the color picker. Click ⊕ then click on the preview canvas to sample a color.</span></span></label>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="color" id="txtColor" value="#00ad2b" style="display:none">
      <div class="cp-swatch" data-for="txtColor" style="background:#00ad2b;" onclick="openCP('txtColor',this)"></div>
      <button class="step-btn eyedrop-btn" data-target="txtColor" style="width:auto;padding:0 8px;font-size:13px;" onclick="startPick('txtColor')">⊕</button>
    </div>
  </div>
  <div class="col">
    <label>Alignment</label>
    <select id="align">
      <option value="center">Center</option>
      <option value="left">Left</option>
      <option value="right">Right</option>
    </select>
  </div>
  <div class="col">
    <label>Line height <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Multiplier for vertical spacing between lines. 1.0 = tight, 1.5 = loose.</span></span></label>
    <div class="range-row">
      <input type="range" id="lheight" min="1" max="2.5" value="1.0" step="0.05">
      <span class="range-val" id="lhOut">1.0×</span>
    </div>
  </div>
  <div class="col">
    <label>Horizontal offset <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Shifts the entire text block left or right from its centered position.</span></span></label>
    <div class="range-row">
      <input type="range" id="offsetX" min="-800" max="800" value="0" step="10">
      <span class="range-val" id="offsetXOut">0px</span>
    </div>
  </div>
  <div class="col">
    <label>Vertical offset <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Shifts the entire text block up or down from its centered position.</span></span></label>
    <div class="range-row">
      <input type="range" id="offsetY" min="-800" max="800" value="0" step="10">
      <span class="range-val" id="offsetYOut">0px</span>
    </div>
  </div>
</div>

<div class="ctrl-group-label">// Effects</div>
<div class="ctrl-grid">
  <div class="col">
    <label>Glow <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Adds a blurred halo around the text using the text color. Higher values = wider glow.</span></span></label>
    <div class="range-row">
      <input type="range" id="glow" min="0" max="30" value="0" step="1">
      <span class="range-val" id="glowOut">0</span>
    </div>
  </div>
  <div class="col">
    <label>Text shadow <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Adds a dark drop shadow behind the text to improve legibility against busy backgrounds. Unlike Glow, uses black.</span></span></label>
    <div class="range-row">
      <input type="range" id="shadow" min="0" max="30" value="0" step="1">
      <span class="range-val" id="shadowOut">0</span>
    </div>
  </div>
  <div class="col">
    <label>Chromatic aberration <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Splits text into RGB channels with a horizontal offset, simulating lens distortion or a misaligned CRT beam.</span></span></label>
    <div class="range-row">
      <input type="range" id="aberration" min="0" max="20" value="0" step="1">
      <span class="range-val" id="aberrationOut">0px</span>
    </div>
  </div>
  <div class="col">
    <label>Scanlines <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Overlays horizontal bright lines across the entire image, simulating a CRT monitor display.</span></span></label>
    <div class="range-row">
      <input type="range" id="scanlines" min="0" max="60" value="0" step="1">
      <span class="range-val" id="slOut">0%</span>
    </div>
  </div>
  <div class="col">
    <label>Film grain <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Adds random pixel noise over the entire image, simulating analog film texture.</span></span></label>
    <div class="range-row">
      <input type="range" id="grain" min="0" max="100" value="0" step="1">
      <span class="range-val" id="grainOut">0%</span>
    </div>
  </div>
</div>

<div class="ctrl-group-label">// Background image</div>
<div class="ctrl-grid">
  <div class="col">
    <label>Image</label>
    <div style="display:flex;gap:6px;">
      <button class="step-btn" style="width:auto;padding:0 8px;font-size:11px;" onclick="$('bgImgInput').click()">Load</button>
      <button class="step-btn" id="bgImgClear" style="width:auto;padding:0 8px;font-size:11px;display:none;" onclick="clearBgImage()">Clear</button>
      <span id="bgImgName" style="font-size:11px;color:#555;align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>
    <input type="file" id="bgImgInput" accept="image/*" style="display:none">
  </div>
  <div class="col" id="bgFitCol" style="display:none">
    <label>Fit <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Cover: fills the canvas, may crop. Contain: shows full image, may letterbox. Stretch: distorts to fill.</span></span></label>
    <select id="bgFit">
      <option value="cover">Cover</option>
      <option value="contain">Contain</option>
      <option value="stretch">Stretch</option>
    </select>
  </div>
  <div class="col" id="bgScaleCol" style="display:none">
    <label>Scale <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Zoom the background image in or out independently of fit mode.</span></span></label>
    <div class="range-row">
      <input type="range" id="bgScale" min="10" max="300" value="100" step="1">
      <span class="range-val" id="bgScaleOut">100%</span>
    </div>
  </div>
  <div class="col" id="bgPosXCol" style="display:none">
    <label>X position <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Shifts the background image left or right.</span></span></label>
    <div class="range-row">
      <input type="range" id="bgPosX" min="-2000" max="2000" value="0" step="10">
      <span class="range-val" id="bgPosXOut">0px</span>
    </div>
  </div>
  <div class="col" id="bgPosYCol" style="display:none">
    <label>Y position <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Shifts the background image up or down.</span></span></label>
    <div class="range-row">
      <input type="range" id="bgPosY" min="-2000" max="2000" value="0" step="10">
      <span class="range-val" id="bgPosYOut">0px</span>
    </div>
  </div>
  <div class="col" id="bgBlurCol" style="display:none">
    <label>Blur <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Blurs the background image. Edge artifacts are hidden automatically by extending the draw area.</span></span></label>
    <div class="range-row">
      <input type="range" id="bgBlur" min="0" max="80" value="5" step="1">
      <span class="range-val" id="bgBlurOut">5px</span>
    </div>
  </div>
  <div class="col" id="bgDimCol" style="display:none">
    <label>Dim <span class="tip-wrap"><span class="tip-icon">[?]</span><span class="tip-box">Darkens the background image with a black overlay to improve text contrast.</span></span></label>
    <div class="range-row">
      <input type="range" id="bgDim" min="0" max="100" value="40" step="1">
      <span class="range-val" id="bgDimOut">40%</span>
    </div>
  </div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;gap:8px;">
  <span class="size-note" id="sizeBadge" style="margin:0;flex:1;">1920 × 1080 px</span>
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="step-btn" onclick="stepZoom(-1)">−</button>
    <span id="zoomOut" style="font-size:11px;color:#666;min-width:36px;text-align:center;">100%</span>
    <button class="step-btn" onclick="stepZoom(1)">+</button>
    <button class="step-btn" onclick="resetZoom()" style="width:auto;padding:0 8px;font-size:10px;text-transform:uppercase;">fit</button>
  </div>
  <button id="guidesBtn" onclick="toggleGuides()" style="flex:none;padding:3px 10px;font-size:10px;border-radius:0;border:1px solid var(--green-dim);background:var(--bg2);color:var(--green);cursor:pointer;font-family:var(--font);letter-spacing:0.05em;text-transform:uppercase;">Guides: on</button>
</div>
<div class="preview-wrap">
  <canvas id="cvs"></canvas>
</div>

<div class="btn-row">
  <button onclick="render()">↺ Refresh preview</button>
  <button onclick="openModal()">⤢ Full preview</button>
  <button class="primary" onclick="download()">⬇ Download PNG</button>
</div>

<div id="cpPopup" class="cp-popup" style="display:none">
  <div class="cp-sv-wrap">
    <canvas id="cpSV" width="200" height="150"></canvas>
    <div id="cpCursor" class="cp-cursor"></div>
  </div>
  <div class="cp-hue-wrap">
    <canvas id="cpHue" width="200" height="14"></canvas>
    <div id="cpHueCursor" class="cp-hue-cursor"></div>
  </div>
  <div class="cp-bottom">
    <div id="cpPreview" class="cp-preview"></div>
    <span class="cp-hash">#</span>
    <input type="text" id="cpHex" class="cp-hex" maxlength="6" spellcheck="false">
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="" alt="preview">
</div>

  <footer id="site-footer">
    Made by <a href="https://github.com/AlejandroMinor" target="_blank" rel="noopener">Alejandro Minor</a>
    <span class="footer-sep">·</span>

</body>
</html>
