<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Wallpaper Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&family=Courier+Prime&family=Cutive+Mono&family=Fira+Mono&family=IBM+Plex+Mono&family=Inconsolata&family=JetBrains+Mono&family=Martian+Mono&family=Nova+Mono&family=Overpass+Mono&family=Roboto+Mono&family=Share+Tech+Mono&family=Source+Code+Pro&family=Space+Mono&family=Ubuntu+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --green:      #00ff41;
    --green-dim:  #00ad2b;
    --green-dark: #003b0f;
    --green-muted:#1a4d1a;
    --bg:         #000;
    --bg2:        #050f05;
    --bg3:        #0a190a;
    --border:     #0d3b0d;
    --border-hi:  #1a6b1a;
    --text:       #a0c8a0;
    --text-dim:   #3a6b3a;
    --font: 'Share Tech Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  /* subtle scanline overlay on the whole page */
  body::before {
    content: '';
    pointer-events: none;
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.12) 3px,
      rgba(0,0,0,0.12) 4px
    );
    z-index: 9999;
  }

  h1 {
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--green);
    margin-bottom: 1.5rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 0 8px var(--green);
  }
  h1::before { content: '> '; opacity: 0.5; }

  .col { display: flex; flex-direction: column; gap: 0.3rem; }

  label {
    font-family: var(--font);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  textarea {
    font-family: var(--font);
    font-size: 12px;
    width: 100%;
    height: 180px;
    resize: both;
    overflow: auto;
    white-space: pre;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 10px;
    color: var(--green-dim);
    margin-bottom: 1rem;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea:focus {
    border-color: var(--green-dim);
    box-shadow: 0 0 6px rgba(0,173,43,0.3);
  }

  select, input[type=color] {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--text);
    padding: 5px 8px;
    font-family: var(--font);
    font-size: 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select:focus, select:hover { border-color: var(--green-dim); }

  input[type=color] {
    height: 32px;
    padding: 2px;
    cursor: pointer;
  }

  input[type=range] {
    width: 100%;
    accent-color: var(--green-dim);
    cursor: pointer;
  }

  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row input { flex: 1; }
  .range-val {
    font-family: var(--font);
    font-size: 11px;
    color: var(--text-dim);
    min-width: 36px;
    text-align: right;
  }

  .step-btn {
    flex: none;
    width: 22px;
    height: 22px;
    padding: 0;
    font-size: 14px;
    line-height: 1;
    border-radius: 0;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    transition: border-color 0.15s, color 0.15s;
  }
  .step-btn:hover { border-color: var(--green-dim); color: var(--green); }

  .preview-wrap {
    border: 1px solid var(--border);
    overflow: auto;
    margin-bottom: 1rem;
    background: var(--bg);
    max-height: 70vh;
    padding: 0.5rem;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  canvas { max-width: 100%; display: block; }

  .size-note {
    font-family: var(--font);
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 0.75rem;
  }

  .btn-row { display: flex; gap: 8px; }

  .textarea-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
    justify-content: flex-end;
    align-items: center;
  }
  .textarea-controls button {
    flex: none;
    padding: 3px 10px;
    font-size: 10px;
    border-radius: 0;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text-dim);
    cursor: pointer;
    font-family: var(--font);
    letter-spacing: 0.05em;
    transition: border-color 0.15s, color 0.15s;
  }
  .textarea-controls button:hover { border-color: var(--green-dim); color: var(--green); }

  button {
    flex: 1;
    padding: 9px 16px;
    border-radius: 0;
    border: 1px solid var(--border-hi);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
  }
  button:hover {
    border-color: var(--green-dim);
    color: var(--green);
    box-shadow: 0 0 8px rgba(0,173,43,0.2);
  }
  button.primary {
    border-color: var(--green-dim);
    color: var(--green);
    background: var(--green-dark);
  }
  button.primary:hover {
    box-shadow: 0 0 12px rgba(0,255,65,0.3);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-overlay img {
    max-width: 100%;
    max-height: 100%;
    border: 1px solid var(--border-hi);
    box-shadow: 0 0 40px rgba(0,255,65,0.1);
    object-fit: contain;
  }
  .modal-close {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: var(--bg2);
    border: 1px solid var(--border-hi);
    color: var(--text);
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    font-family: var(--font);
    transition: color 0.15s, border-color 0.15s;
  }
  .modal-close:hover { color: var(--green); border-color: var(--green-dim); }

  .ctrl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    margin-bottom: 1rem;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); }
  ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }
</style>
</head>
<body>

<h1>ASCII Wallpaper Generator</h1>

<label style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;display:block;margin-bottom:4px;">ASCII Text</label>
<div class="textarea-controls">
  <button onclick="clearAscii()">Clear</button>
  <button onclick="pasteAscii()">Paste</button>
  <button onclick="$('fileInput').click()">Load file</button>
  <input type="file" id="fileInput" accept=".txt" style="display:none">
  <span style="width:1px;background:#333;align-self:stretch;"></span>
  <button class="step-btn" onclick="stepTextarea(-1)">−</button>
  <span id="taSize" style="font-size:11px;color:#666;min-width:28px;text-align:center;">12px</span>
  <button class="step-btn" onclick="stepTextarea(1)">+</button>
</div>
<textarea id="ascii" spellcheck="false" autocorrect="off" autocomplete="off">

<div class="ctrl-grid">
  <div class="col">
    <label>Resolution</label>
    <select id="orient">
      <option value="fhd-l">FHD Landscape — 1920×1080</option>
      <option value="fhd-p">FHD Portrait — 1080×1920</option>
      <option value="2k-l">2K Landscape — 2560×1440</option>
      <option value="2k-p">2K Portrait — 1440×2560</option>
      <option value="4k-l">4K Landscape — 3840×2160</option>
      <option value="4k-p">4K Portrait — 2160×3840</option>
    </select>
  </div>
  <div class="col">
    <label>Font</label>
    <select id="fontfam">
      <option value="'Share Tech Mono', monospace" selected>Share Tech Mono</option>
      <option value="'VT323', monospace">VT323 — CRT terminal</option>
      <option value="'Nova Mono', monospace">Nova Mono</option>
      <option value="'Martian Mono', monospace">Martian Mono</option>
      <option value="'Cutive Mono', monospace">Cutive Mono — typewriter</option>
      <option value="'Inconsolata', monospace">Inconsolata</option>
      <option value="'Source Code Pro', monospace">Source Code Pro</option>
      <option value="'Anonymous Pro', monospace">Anonymous Pro</option>
      <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      <option value="'Fira Mono', monospace">Fira Mono</option>
      <option value="'Overpass Mono', monospace">Overpass Mono</option>
      <option value="'Ubuntu Mono', monospace">Ubuntu Mono</option>
      <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
      <option value="'Roboto Mono', monospace">Roboto Mono</option>
      <option value="'Space Mono', monospace">Space Mono</option>
      <option value="'Courier Prime', monospace">Courier Prime — typewriter</option>
      <option value="monospace">System Monospace</option>
    </select>
  </div>
  <div class="col">
    <label>Font size</label>
    <div class="range-row">
      <button class="step-btn" onclick="stepFont(-1)">−</button>
      <input type="range" id="fsize" min="1" max="120" value="14" step="1">
      <button class="step-btn" onclick="stepFont(1)">+</button>
      <span class="range-val" id="fsizeOut">14px</span>
    </div>
  </div>
  <div class="col">
    <label>Text color</label>
    <input type="color" id="txtColor" value="#00ad2b">
  </div>
  <div class="col">
    <label>Background color</label>
    <input type="color" id="bgColor" value="#0d0d0d">
  </div>
  <div class="col">
    <label>Alignment</label>
    <select id="align">
      <option value="center">Center</option>
      <option value="left">Left</option>
      <option value="right">Right</option>
    </select>
  </div>
  <div class="col">
    <label>Line height</label>
    <div class="range-row">
      <input type="range" id="lheight" min="1" max="2.5" value="1.0" step="0.05">
      <span class="range-val" id="lhOut">1.0×</span>
    </div>
  </div>
  <div class="col">
    <label>Scanlines</label>
    <div class="range-row">
      <input type="range" id="scanlines" min="0" max="60" value="0" step="1">
      <span class="range-val" id="slOut">0%</span>
    </div>
  </div>
  <div class="col">
    <label>Glow</label>
    <div class="range-row">
      <input type="range" id="glow" min="0" max="30" value="0" step="1">
      <span class="range-val" id="glowOut">0</span>
    </div>
  </div>
  <div class="col">
    <label>Horizontal offset</label>
    <div class="range-row">
      <input type="range" id="offsetX" min="-800" max="800" value="0" step="10">
      <span class="range-val" id="offsetXOut">0px</span>
    </div>
  </div>
  <div class="col">
    <label>Vertical offset</label>
    <div class="range-row">
      <input type="range" id="offsetY" min="-800" max="800" value="0" step="10">
      <span class="range-val" id="offsetYOut">0px</span>
    </div>
  </div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;gap:8px;">
  <span class="size-note" id="sizeBadge" style="margin:0;flex:1;">1920 × 1080 px</span>
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="step-btn" onclick="stepZoom(-1)">−</button>
    <span id="zoomOut" style="font-size:11px;color:#666;min-width:36px;text-align:center;">100%</span>
    <button class="step-btn" onclick="stepZoom(1)">+</button>
    <button class="step-btn" onclick="resetZoom()" style="width:auto;padding:0 8px;font-size:10px;text-transform:uppercase;">fit</button>
  </div>
  <button id="guidesBtn" onclick="toggleGuides()" style="flex:none;padding:3px 10px;font-size:10px;border-radius:0;border:1px solid var(--green-dim);background:var(--bg2);color:var(--green);cursor:pointer;font-family:var(--font);letter-spacing:0.05em;text-transform:uppercase;">Guides: on</button>
</div>
<div class="preview-wrap">
  <canvas id="cvs"></canvas>
</div>

<div class="btn-row">
  <button onclick="render()">↺ Refresh preview</button>
  <button onclick="openModal()">⤢ Full preview</button>
  <button class="primary" onclick="download()">⬇ Download PNG</button>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="" alt="preview">
</div>

<script>
const $ = id => document.getElementById(id);

let showGuides = true;

function toggleGuides() {
  showGuides = !showGuides;
  $('guidesBtn').textContent = `Guides: ${showGuides ? 'on' : 'off'}`;
  $('guidesBtn').style.color = showGuides ? '#5fdf5f' : '#888';
  render();
}

function drawGuides(canvas, W, H) {
  const ctx = canvas.getContext('2d');
  const lw = Math.max(2, Math.round(W / 960));

  function hline(y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(0, Math.round(y), W, lw);
  }
  function vline(x, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), 0, lw, H);
  }

  // center cross
  vline(W / 2, 'rgba(255,255,255,0.3)');
  hline(H / 2, 'rgba(255,255,255,0.3)');

  // rule of thirds
  [1/3, 2/3].forEach(t => {
    vline(W * t, 'rgba(255,255,255,0.12)');
    hline(H * t, 'rgba(255,255,255,0.12)');
  });
}

function stepFont(delta) {
  const el = $('fsize');
  el.value = Math.min(120, Math.max(1, parseInt(el.value) + delta));
  $('fsizeOut').textContent = el.value + 'px';
  render();
}

let taFontSize = 12;

function stepTextarea(delta) {
  taFontSize = Math.min(48, Math.max(1, taFontSize + delta));
  $('ascii').style.fontSize = taFontSize + 'px';
  $('taSize').textContent = taFontSize + 'px';
}

// pinch on textarea controls textarea font size
let pinchDist0 = null;
let taSize0 = null;
document.addEventListener('DOMContentLoaded', () => {
  $('ascii').addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist0 = Math.hypot(dx, dy);
      taSize0 = taFontSize;
    }
  }, { passive: true });
  $('ascii').addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      taFontSize = Math.min(48, Math.max(1, Math.round(taSize0 * dist / pinchDist0)));
      $('ascii').style.fontSize = taFontSize + 'px';
      $('taSize').textContent = taFontSize + 'px';
    }
  }, { passive: true });
  $('ascii').addEventListener('touchend', () => { pinchDist0 = null; });
});

$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    $('ascii').value = ev.target.result;
    render();
  };
  reader.readAsText(file);
  e.target.value = '';
});

function clearAscii() {
  $('ascii').value = '';
  render();
}

async function pasteAscii() {
  try {
    const text = await navigator.clipboard.readText();
    $('ascii').value = text;
    render();
  } catch {
    $('ascii').focus();
    document.execCommand('paste');
    render();
  }
}

const RESOLUTIONS = {
  'fhd-l': [1920, 1080], 'fhd-p': [1080, 1920],
  '2k-l':  [2560, 1440], '2k-p':  [1440, 2560],
  '4k-l':  [3840, 2160], '4k-p':  [2160, 3840],
};

function getConfig() {
  const [W, H] = RESOLUTIONS[$('orient').value];
  return {
    W, H,
    text: $('ascii').value,
    font: $('fontfam').value,
    fsize: parseInt($('fsize').value),
    txtColor: $('txtColor').value,
    bgColor: $('bgColor').value,
    align: $('align').value,
    lheight: parseFloat($('lheight').value),
    scanlines: parseInt($('scanlines').value),
    glow: parseInt($('glow').value),
    offsetX: parseInt($('offsetX').value),
    offsetY: parseInt($('offsetY').value),
  };
}

function drawToCanvas(canvas, cfg) {
  const { W, H, text, font, fsize, txtColor, bgColor, align, lheight, scanlines, glow, offsetX, offsetY } = cfg;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  if (scanlines > 0) {
    for (let y = 0; y < H; y += 4) {
      ctx.fillStyle = `rgba(255,255,255,${scanlines / 2000})`;
      ctx.fillRect(0, y, W, 2);
    }
  }

  ctx.font = `${fsize}px ${font}`;
  ctx.textBaseline = 'top';

  const lines = text.split('\n');
  const lineH = fsize * lheight;
  const totalH = lines.length * lineH;
  const startY = (H - totalH) / 2 + offsetY;

  function drawLines(alpha) {
    ctx.fillStyle = txtColor;
    ctx.globalAlpha = alpha;
    lines.forEach((line, i) => {
      const y = startY + i * lineH;
      const lw = ctx.measureText(line).width;
      let x;
      if (align === 'center') x = (W - lw) / 2;
      else if (align === 'right') x = W - lw - 60;
      else x = 60;
      ctx.fillText(line, x + offsetX, y);
    });
  }

  if (glow > 0) {
    ctx.shadowColor = txtColor;
    ctx.shadowBlur = glow * 2.5;
    drawLines(0.6);
    ctx.shadowBlur = glow;
    drawLines(0.4);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  drawLines(1);
}

let previewZoom = 0.5;

function getFitScale(cfg) {
  const maxW = $('cvs').parentElement.clientWidth - 16;
  return Math.min(maxW / cfg.W, 1);
}

function stepZoom(dir) {
  const cfg = getConfig();
  const fit = getFitScale(cfg);
  if (previewZoom === null) previewZoom = fit;
  const steps = [0.1, 0.15, 0.2, 0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2];
  const idx = steps.findIndex(s => s > previewZoom + 0.01);
  if (dir > 0) previewZoom = steps[Math.min(idx === -1 ? steps.length - 1 : idx, steps.length - 1)];
  else previewZoom = steps[Math.max((idx === -1 ? steps.length : idx) - 2, 0)];
  render();
}

function resetZoom() {
  previewZoom = null;
  render();
}

function render() {
  const cfg = getConfig();
  const preview = $('cvs');
  drawToCanvas(preview, cfg);
  if (showGuides) drawGuides(preview, cfg.W, cfg.H);
  const scale = previewZoom !== null ? previewZoom : getFitScale(cfg);
  preview.style.width = Math.round(cfg.W * scale) + 'px';
  preview.style.height = Math.round(cfg.H * scale) + 'px';
  $('zoomOut').textContent = Math.round(scale * 100) + '%';
  $('sizeBadge').textContent = `${cfg.W} × ${cfg.H} px`;
}

function openModal() {
  const cfg = getConfig();
  const c = document.createElement('canvas');
  drawToCanvas(c, cfg);
  $('modalImg').src = c.toDataURL('image/png');
  $('modal').classList.add('open');
}

function closeModal() {
  $('modal').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function download() {
  const cfg = getConfig();
  const c = document.createElement('canvas');
  drawToCanvas(c, cfg);
  const a = document.createElement('a');
  a.download = `wallpaper_${cfg.W}x${cfg.H}.png`;
  a.href = c.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function syncTextareaFont() {
  $('ascii').style.fontFamily = $('fontfam').value;
}

['ascii','orient','fontfam','txtColor','bgColor','align'].forEach(id => {
  $(id).addEventListener('change', () => {
    if (id === 'fontfam') {
      syncTextareaFont();
      document.fonts.load(`16px ${$('fontfam').value}`).then(render);
    } else render();
  });
  $(id).addEventListener('input', render);
});

$('fsize').addEventListener('input', () => {
  $('fsizeOut').textContent = $('fsize').value + 'px';
  render();
});
$('lheight').addEventListener('input', () => {
  $('lhOut').textContent = parseFloat($('lheight').value).toFixed(2) + '×';
  render();
});
$('scanlines').addEventListener('input', () => {
  $('slOut').textContent = $('scanlines').value + '%';
  render();
});
$('glow').addEventListener('input', () => {
  $('glowOut').textContent = $('glow').value;
  render();
});
$('offsetX').addEventListener('input', () => {
  $('offsetXOut').textContent = $('offsetX').value + 'px';
  render();
});
$('offsetY').addEventListener('input', () => {
  $('offsetYOut').textContent = $('offsetY').value + 'px';
  render();
});

document.fonts.ready.then(() => { syncTextareaFont(); render(); });
</script>
</body>
</html>
